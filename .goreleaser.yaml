version: 2

builds:
  - id: netnotify
    main: ./cmd/netnotify
    binary: netnotify
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "netnotify_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
